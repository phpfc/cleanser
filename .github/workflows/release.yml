name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    strategy:
      matrix:
        target:
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p cleanser

      - name: Strip binary
        run: strip target/${{ matrix.target }}/release/cleanser

      - name: Create archive
        run: |
          cd target/${{ matrix.target }}/release
          tar czf cleanser-${{ steps.get_version.outputs.version }}-${{ matrix.target }}.tar.gz cleanser
          shasum -a 256 cleanser-${{ steps.get_version.outputs.version }}-${{ matrix.target }}.tar.gz > cleanser-${{ steps.get_version.outputs.version }}-${{ matrix.target }}.tar.gz.sha256

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            target/${{ matrix.target }}/release/cleanser-${{ steps.get_version.outputs.version }}-${{ matrix.target }}.tar.gz
            target/${{ matrix.target }}/release/cleanser-${{ steps.get_version.outputs.version }}-${{ matrix.target }}.tar.gz.sha256

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release binary
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          fi
          cargo build --release --target ${{ matrix.target }} -p cleanser

      - name: Strip binary
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            aarch64-linux-gnu-strip target/${{ matrix.target }}/release/cleanser
          else
            strip target/${{ matrix.target }}/release/cleanser
          fi

      - name: Create archive
        run: |
          cd target/${{ matrix.target }}/release
          tar czf cleanser-${{ steps.get_version.outputs.version }}-${{ matrix.target }}.tar.gz cleanser
          sha256sum cleanser-${{ steps.get_version.outputs.version }}-${{ matrix.target }}.tar.gz > cleanser-${{ steps.get_version.outputs.version }}-${{ matrix.target }}.tar.gz.sha256

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            target/${{ matrix.target }}/release/cleanser-${{ steps.get_version.outputs.version }}-${{ matrix.target }}.tar.gz
            target/${{ matrix.target }}/release/cleanser-${{ steps.get_version.outputs.version }}-${{ matrix.target }}.tar.gz.sha256

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    strategy:
      matrix:
        target:
          - x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        shell: bash
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p cleanser

      - name: Create archive
        shell: pwsh
        run: |
          $version = "${{ steps.get_version.outputs.version }}"
          $target = "${{ matrix.target }}"
          cd target/$target/release
          Compress-Archive -Path cleanser.exe -DestinationPath "cleanser-$version-$target.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "cleanser-$version-$target.zip").Hash.ToLower()
          "$hash  cleanser-$version-$target.zip" | Out-File -Encoding utf8 "cleanser-$version-$target.zip.sha256"

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            target/${{ matrix.target }}/release/cleanser-${{ steps.get_version.outputs.version }}-${{ matrix.target }}.zip
            target/${{ matrix.target }}/release/cleanser-${{ steps.get_version.outputs.version }}-${{ matrix.target }}.zip.sha256

  create-release:
    name: Create Release
    needs: [build-macos, build-linux, build-windows, build-gui-macos, build-gui-linux, build-gui-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Update release body
        uses: softprops/action-gh-release@v1
        with:
          body: |
            ## 🖥️ GUI Application (Desktop)

            Download the desktop application with graphical interface:

            | Platform | Architecture | File |
            |----------|--------------|------|
            | macOS | Intel | `Cleanser-${{ steps.get_version.outputs.version }}-x86_64-apple-darwin.dmg` |
            | macOS | Apple Silicon | `Cleanser-${{ steps.get_version.outputs.version }}-aarch64-apple-darwin.dmg` |
            | Linux | x86_64 | `Cleanser-${{ steps.get_version.outputs.version }}-x86_64.AppImage` or `cleanser-gui_${{ steps.get_version.outputs.version }}_amd64.deb` |
            | Windows | x86_64 | `Cleanser-${{ steps.get_version.outputs.version }}-x64-setup.exe` |

            > **macOS Note:** The app is ad-hoc signed. On first launch, right-click the app and select "Open", or run `xattr -cr /Applications/Cleanser.app` in Terminal.

            ## ⌨️ CLI Tool (Command Line)

            ### Homebrew (macOS)
            ```bash
            brew tap phpfc/cleanser
            brew install cleanser
            ```

            ### Cargo
            ```bash
            cargo install --git https://github.com/phpfc/cleanser.git cleanser
            ```

            ### Manual Installation
            Download the CLI binary for your system:

            | Platform | Architecture | File |
            |----------|--------------|------|
            | macOS | Intel | `cleanser-${{ steps.get_version.outputs.version }}-x86_64-apple-darwin.tar.gz` |
            | macOS | Apple Silicon | `cleanser-${{ steps.get_version.outputs.version }}-aarch64-apple-darwin.tar.gz` |
            | Linux | x86_64 | `cleanser-${{ steps.get_version.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz` |
            | Linux | ARM64 | `cleanser-${{ steps.get_version.outputs.version }}-aarch64-unknown-linux-gnu.tar.gz` |
            | Windows | x86_64 | `cleanser-${{ steps.get_version.outputs.version }}-x86_64-pc-windows-msvc.zip` |

            ## Changes
            See [CHANGELOG.md](https://github.com/phpfc/cleanser/blob/main/CHANGELOG.md) for details.

  update-landing:
    name: Update Landing Page Downloads
    needs: [build-macos, build-linux, build-windows, build-gui-macos, build-gui-linux, build-gui-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p downloads
          gh release download ${{ github.ref_name }} --repo phpfc/cleanser --dir downloads

      - name: Clone landing page repo
        env:
          GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone https://x-access-token:${{ secrets.HOMEBREW_TAP_TOKEN }}@github.com/phpfc/cleanser-landing.git landing

      - name: Update downloads
        run: |
          rm -rf landing/downloads
          mv downloads landing/
          VERSION="${{ steps.get_version.outputs.version }}"

          # Create downloads.json with version info and categorized files
          cat > landing/downloads/index.json << EOF
          {
            "version": "${VERSION}",
            "date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "gui": {
              "macos": {
                "intel": "Cleanser-${VERSION}-x86_64-apple-darwin.dmg",
                "arm": "Cleanser-${VERSION}-aarch64-apple-darwin.dmg"
              },
              "linux": {
                "appimage": "Cleanser-${VERSION}-x86_64.AppImage",
                "deb": "cleanser-gui_${VERSION}_amd64.deb"
              },
              "windows": {
                "installer": "Cleanser-${VERSION}-x64-setup.exe"
              }
            },
            "cli": {
              "macos": {
                "intel": "cleanser-${VERSION}-x86_64-apple-darwin.tar.gz",
                "arm": "cleanser-${VERSION}-aarch64-apple-darwin.tar.gz"
              },
              "linux": {
                "x86_64": "cleanser-${VERSION}-x86_64-unknown-linux-gnu.tar.gz",
                "arm64": "cleanser-${VERSION}-aarch64-unknown-linux-gnu.tar.gz"
              },
              "windows": {
                "x86_64": "cleanser-${VERSION}-x86_64-pc-windows-msvc.zip"
              }
            },
            "files": $(ls -1 landing/downloads | grep -v index.json | jq -R -s -c 'split("\n") | map(select(length > 0))')
          }
          EOF

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          cd landing
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloads/
          git commit -m "Update downloads to v${{ steps.get_version.outputs.version }}"
          git push

  # ===========================================================================
  # GUI Builds (Tauri)
  # ===========================================================================

  build-gui-macos:
    name: Build GUI macOS
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            arch: x64
          - target: aarch64-apple-darwin
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: |
          cd crates/cleanser-gui/ui
          npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/cleanser-gui
          args: --target ${{ matrix.target }}

      - name: Ad-hoc sign and recreate DMG
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          TARGET="${{ matrix.target }}"

          # Find the .app bundle
          APP_BUNDLE=$(find target/$TARGET/release/bundle/macos -name "*.app" -type d 2>/dev/null | head -1)

          if [ -n "$APP_BUNDLE" ]; then
            echo "Found app bundle: $APP_BUNDLE"

            # Ad-hoc sign the app bundle
            echo "Signing app bundle..."
            codesign --force --deep --sign - "$APP_BUNDLE"

            # Verify signature
            echo "Verifying signature..."
            codesign --verify --verbose "$APP_BUNDLE"

            # Create a new DMG with the signed app
            APP_NAME=$(basename "$APP_BUNDLE")
            NEW_DMG="Cleanser-${VERSION}-${TARGET}.dmg"

            echo "Creating DMG with signed app..."
            hdiutil create -volname "Cleanser" -srcfolder "$APP_BUNDLE" -ov -format UDZO "$NEW_DMG"

            # Create checksum
            shasum -a 256 "$NEW_DMG" > "${NEW_DMG}.sha256"
            echo "Created $NEW_DMG"
          else
            echo "Warning: No .app bundle found"
            find target -name "*.app" -type d 2>/dev/null || echo "No .app bundles found anywhere"
            exit 1
          fi

      - name: Upload DMG to release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Cleanser-*.dmg
            Cleanser-*.dmg.sha256

  build-gui-linux:
    name: Build GUI Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: |
          cd crates/cleanser-gui/ui
          npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/cleanser-gui

      - name: Rename and prepare packages
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"

          # Find and rename .deb (tauri builds to root target/, not crates/cleanser-gui/target/)
          DEB_FILE=$(find target/release/bundle/deb -name "*.deb" 2>/dev/null | head -1)
          if [ -n "$DEB_FILE" ]; then
            NEW_DEB="cleanser-gui_${VERSION}_amd64.deb"
            cp "$DEB_FILE" "$NEW_DEB"
            sha256sum "$NEW_DEB" > "${NEW_DEB}.sha256"
            echo "Created $NEW_DEB"
          else
            echo "Warning: DEB not found"
          fi

          # Find and rename .AppImage
          APPIMAGE_FILE=$(find target/release/bundle/appimage -name "*.AppImage" 2>/dev/null | head -1)
          if [ -n "$APPIMAGE_FILE" ]; then
            NEW_APPIMAGE="Cleanser-${VERSION}-x86_64.AppImage"
            cp "$APPIMAGE_FILE" "$NEW_APPIMAGE"
            sha256sum "$NEW_APPIMAGE" > "${NEW_APPIMAGE}.sha256"
            echo "Created $NEW_APPIMAGE"
          else
            echo "Warning: AppImage not found"
          fi

      - name: Upload packages to release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            cleanser-gui_*.deb
            cleanser-gui_*.deb.sha256
            Cleanser-*.AppImage
            Cleanser-*.AppImage.sha256

  build-gui-windows:
    name: Build GUI Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        shell: bash
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: |
          cd crates/cleanser-gui/ui
          npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/cleanser-gui

      - name: Rename and prepare installer
        shell: pwsh
        run: |
          $version = "${{ steps.get_version.outputs.version }}"

          # List what was generated (tauri builds to root target/, not crates/cleanser-gui/target/)
          Write-Host "Bundle contents:"
          Get-ChildItem -Path "target/release/bundle" -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }

          # Find the NSIS installer
          $nsisPath = "target/release/bundle/nsis"
          if (Test-Path $nsisPath) {
            $nsis = Get-ChildItem -Path $nsisPath -Filter "*.exe" | Select-Object -First 1
            if ($nsis) {
              $newName = "Cleanser-${version}-x64-setup.exe"
              Copy-Item $nsis.FullName $newName
              $hash = (Get-FileHash -Algorithm SHA256 $newName).Hash.ToLower()
              "$hash  $newName" | Out-File -Encoding utf8 "${newName}.sha256"
              Write-Host "Created $newName"
            }
          }

          # Find the MSI installer (if generated)
          $msiPath = "target/release/bundle/msi"
          if (Test-Path $msiPath) {
            $msi = Get-ChildItem -Path $msiPath -Filter "*.msi" | Select-Object -First 1
            if ($msi) {
              $newMsiName = "Cleanser-${version}-x64.msi"
              Copy-Item $msi.FullName $newMsiName
              $hash = (Get-FileHash -Algorithm SHA256 $newMsiName).Hash.ToLower()
              "$hash  $newMsiName" | Out-File -Encoding utf8 "${newMsiName}.sha256"
              Write-Host "Created $newMsiName"
            }
          }

      - name: Upload installer to release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Cleanser-*-setup.exe
            Cleanser-*-setup.exe.sha256
            Cleanser-*.msi
            Cleanser-*.msi.sha256

  # ===========================================================================
  # Homebrew
  # ===========================================================================

  build-bottle:
    name: Build Homebrew Bottle
    needs: build-macos
    runs-on: macos-latest
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Get version from tag
        id: get_version
        run: |
          echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Clone tap repository
        run: |
          git clone https://github.com/phpfc/homebrew-cleanser.git tap-repo

      - name: Download and calculate source tarball SHA256
        run: |
          curl -sL "https://github.com/phpfc/cleanser/archive/refs/tags/${{ steps.get_version.outputs.tag }}.tar.gz" -o source.tar.gz
          echo "SOURCE_SHA=$(shasum -a 256 source.tar.gz | awk '{print $1}')" >> $GITHUB_ENV

      - name: Update formula source version and SHA256
        run: |
          cd tap-repo
          VERSION="${{ steps.get_version.outputs.version }}"
          TAG="${{ steps.get_version.outputs.tag }}"

          # Update source URL and SHA256
          sed -i '' "s|url \".*\"|url \"https://github.com/phpfc/cleanser/archive/refs/tags/${TAG}.tar.gz\"|" Formula/cleanser.rb
          sed -i '' "s|sha256 \".*\"|sha256 \"${SOURCE_SHA}\"|" Formula/cleanser.rb

          # Update test assertion to match new version (non-greedy match)
          sed -i '' "s|assert_match \"cleanser [^\"]*\"|assert_match \"cleanser ${VERSION}\"|" Formula/cleanser.rb

      - name: Commit and push formula source update
        env:
          GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          cd tap-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/cleanser.rb
          git commit -m "Update cleanser source to v${{ steps.get_version.outputs.version }}"
          git push https://x-access-token:${{ secrets.HOMEBREW_TAP_TOKEN }}@github.com/phpfc/homebrew-cleanser.git main

      - name: Tap and install formula
        run: |
          brew tap phpfc/cleanser
          brew install --build-bottle cleanser

      - name: Build bottle
        id: bottle
        run: |
          brew bottle --json cleanser
          BOTTLE_FILE=$(ls cleanser--*.bottle.*.tar.gz 2>/dev/null || ls ./cleanser--*.bottle.*.tar.gz)
          BOTTLE_JSON=$(ls cleanser--*.bottle.json 2>/dev/null || ls ./cleanser--*.bottle.json)

          # Rename bottle file from double-dash to single-dash (Homebrew naming convention)
          RENAMED_BOTTLE=$(echo "${BOTTLE_FILE}" | sed 's/cleanser--/cleanser-/')
          mv "${BOTTLE_FILE}" "${RENAMED_BOTTLE}"

          echo "bottle_file=${RENAMED_BOTTLE}" >> $GITHUB_OUTPUT
          echo "bottle_json=${BOTTLE_JSON}" >> $GITHUB_OUTPUT
          echo "Original bottle file: ${BOTTLE_FILE}"
          echo "Renamed bottle file: ${RENAMED_BOTTLE}"
          echo "Bottle JSON: ${BOTTLE_JSON}"

      - name: Upload bottle to release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.bottle.outputs.bottle_file }}

      - name: Pull latest formula changes
        run: |
          cd tap-repo
          git pull

      - name: Update formula with bottle info
        run: |
          cd tap-repo

          # Extract bottle info from JSON
          BOTTLE_SHA=$(cat ../${{ steps.bottle.outputs.bottle_json }} | jq -r '.[] | .bottle.tags | to_entries[0].value.sha256')
          BOTTLE_TAG=$(cat ../${{ steps.bottle.outputs.bottle_json }} | jq -r '.[] | .bottle.tags | to_entries[0].key')
          BOTTLE_REBUILD=$(cat ../${{ steps.bottle.outputs.bottle_json }} | jq -r '.[] | .bottle.rebuild')
          TAG="${{ steps.get_version.outputs.tag }}"

          echo "Bottle SHA: ${BOTTLE_SHA}"
          echo "Bottle OS tag: ${BOTTLE_TAG}"
          echo "Bottle rebuild: ${BOTTLE_REBUILD}"

          # Update bottle root_url
          sed -i '' "s|root_url \".*\"|root_url \"https://github.com/phpfc/cleanser/releases/download/${TAG}\"|" Formula/cleanser.rb

          # Update bottle rebuild number
          sed -i '' "s|rebuild .*|rebuild ${BOTTLE_REBUILD}|" Formula/cleanser.rb

          # Update bottle SHA256 with correct OS tag
          sed -i '' "s|sha256 cellar: :any_skip_relocation, .*: \".*\"|sha256 cellar: :any_skip_relocation, ${BOTTLE_TAG}: \"${BOTTLE_SHA}\"|" Formula/cleanser.rb

      - name: Commit and push formula bottle update
        env:
          GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          cd tap-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/cleanser.rb
          git commit -m "Update cleanser to v${{ steps.get_version.outputs.version }}"
          git push https://x-access-token:${{ secrets.HOMEBREW_TAP_TOKEN }}@github.com/phpfc/homebrew-cleanser.git main
