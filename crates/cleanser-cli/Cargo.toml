[package]
name = "cleanser"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "A fast cross-platform CLI tool for clearing storage space"
keywords = ["cli", "cleanup", "storage", "cross-platform", "cache"]
categories = ["command-line-utilities"]

[[bin]]
name = "cleanser"
path = "src/main.rs"

[dependencies]
cleanser-core = { path = "../cleanser-core", features = ["update-check"] }
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
indicatif = "0.17"
ratatui = "0.26"
crossterm = "0.27"
anyhow = "1.0"
humansize = "2.1"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.10"
